---
# DESTRUCTIVE: wipes Kubernetes state from every node so you can rebuild.
#   ansible-playbook reset.yml -e confirm_reset=yes

- name: Reset Kubernetes on all nodes
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Refuse to run without explicit confirmation
      ansible.builtin.assert:
        that: confirm_reset | default('no') == 'yes'
        fail_msg: "Re-run with -e confirm_reset=yes. This deletes the cluster."

    - name: Run kubeadm reset
      ansible.builtin.command: kubeadm reset --force
      register: reset_out
      changed_when: true
      failed_when: false

    - name: Remove leftover CNI, kube-vip and kubeconfig state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/calico
        - /etc/kubernetes/manifests/kube-vip.yaml
        - /root/.kube
        - "/home/{{ ansible_user }}/.kube"

    - name: Flush iptables rules left by kube-proxy and Calico
      ansible.builtin.shell: |
        set -o pipefail
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
      args:
        executable: /bin/bash
      changed_when: true