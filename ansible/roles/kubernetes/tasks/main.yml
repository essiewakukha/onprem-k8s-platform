---
- name: Add Kubernetes apt signing key for v{{ kubernetes_minor }}
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg
  args:
    executable: /bin/bash
    creates: "/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg"

- name: Add Kubernetes apt repository (one repo per minor version)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/ /
    filename: kubernetes
    state: present

- name: Install pinned kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    update_cache: true
    allow_change_held_packages: true
    allow_downgrade: false

- name: Hold Kubernetes packages at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Pin kubelet to the node's primary IP (avoids NAT/secondary NIC surprises)
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}
  notify: Restart kubelet

- name: Enable kubelet (it crash-loops until kubeadm configures it; that is expected)
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true