---
- name: Check whether this node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join as an additional control-plane node
  when: not kubelet_conf.stat.exists
  block:
    - name: Write kube-vip static pod before joining
      ansible.builtin.include_role:
        name: kube_vip
      vars:
        kube_vip_kubeconfig: /etc/kubernetes/admin.conf
      when: kube_vip_enabled

    - name: Run kubeadm join --control-plane
      ansible.builtin.command: >-
        {{ hostvars[groups['control_plane'][0]]['kubeadm_join_command'] }}
        --control-plane
        --certificate-key {{ hostvars[groups['control_plane'][0]]['kubeadm_certificate_key'] }}
        --apiserver-advertise-address {{ ansible_host }}
        --node-name {{ inventory_hostname }}
      changed_when: true

- name: Create root kubeconfig directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Install admin kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"