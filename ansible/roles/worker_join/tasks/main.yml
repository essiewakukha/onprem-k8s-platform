---
- name: Check whether this node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join the cluster as a worker
  ansible.builtin.command: >-
    {{ hostvars[groups['control_plane'][0]]['kubeadm_join_command'] }}
    --node-name {{ inventory_hostname }}
  when: not kubelet_conf.stat.exists
  changed_when: true

- name: Label node as a worker
  ansible.builtin.command: >-
    kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/worker= --overwrite
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false