# Application namespace. Owned by the platform (cluster admin), not by CI.
# Pod Security "restricted" rejects privileged / root / host-mounting pods.
apiVersion: v1
kind: Namespace
metadata:
  name: notes
  labels:
    app.kubernetes.io/part-of: k8s-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Guard rails so one bad manifest cannot starve the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: notes-quota
  namespace: notes
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    requests.storage: 100Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: notes-defaults
  namespace: notes
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi