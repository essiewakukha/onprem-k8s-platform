# Identity used by CI (GitHub Actions) to deploy the Helm release.
# Scoped to the "notes" namespace only: it cannot touch other namespaces,
# nodes, CRDs, cluster-wide RBAC, or the namespace's own quota/labels.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: notes
automountServiceAccountToken: false
---
# Long-lived token for the CI kubeconfig. Rotate by deleting this Secret and
# re-running scripts/create-deployer-kubeconfig.sh.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: notes
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-deployer
  namespace: notes
rules:
  # Helm stores release state in Secrets; the chart creates the rest.
  - apiGroups: [""]
    resources: [secrets, configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read access for rollout status and `helm --wait`; create/delete for `helm test`.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: notes
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: notes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-deployer