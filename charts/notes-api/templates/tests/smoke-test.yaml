{{- if .Values.tests.enabled }}
# `helm test <release>` runs this pod after a deploy. It reuses the app image
# (no extra image to mirror into the internal registry) and checks the
# Service end to end: readiness, a write to the volume, and a read back.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "notes-api.fullname" . }}-smoke-test
  # Deliberately NOT the app's selector labels, so the Service and PDB never
  # treat this pod as an app replica.
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke
      image: {{ include "notes-api.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      env:
        - name: BASE_URL
          value: "http://{{ include "notes-api.fullname" . }}:{{ .Values.service.port }}"
      command:
        - node
        - -e
        - |
          const base = process.env.BASE_URL;
          const check = async (label, fn) => {
            try { await fn(); console.log('ok  ', label); }
            catch (e) { console.error('FAIL', label, e.message); process.exit(1); }
          };
          (async () => {
            await check('GET /readyz', async () => {
              const r = await fetch(base + '/readyz');
              if (r.status !== 200) throw new Error('status ' + r.status);
            });
            let id;
            await check('POST /api/notes', async () => {
              const r = await fetch(base + '/api/notes', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ text: 'helm test ' + new Date().toISOString() }),
              });
              if (r.status !== 201) throw new Error('status ' + r.status);
              id = (await r.json()).id;
            });
            await check('GET /api/notes contains new note', async () => {
              const notes = await (await fetch(base + '/api/notes')).json();
              if (!notes.some((n) => n.id === id)) throw new Error('note not found');
            });
          })();
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}